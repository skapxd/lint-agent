name: CI/CD con GuardDog

on:
  push:
    branches: [ "main" ]
    # Cada tag vX.Y.Z dispara la publicacion a NPM.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 requiere Node >= 22.13.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Use Node.js ${{ matrix.node-version }}
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Check security policy and Socket badge
        run: |
          pnpm test:security
          node scripts/sync-socket-badge.mjs --check

      # Empaquetar una sola vez desde el build validado de Node 22.
      - name: Pack release candidate
        if: matrix.node-version == '22.x'
        run: node scripts/security/pack-release.mjs

      - name: Upload release candidate
        if: matrix.node-version == '22.x'
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: release-artifact/
          if-no-files-found: error
          retention-days: 90

  peer-minimum-contract:
    name: Peer Minimum Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Use Node.js 22.x
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check peer minimum contract
        run: pnpm test:peer-minimum

  peer-latest-contract:
    name: Peer Latest Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Use Node.js 22.x
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check peer latest contract
        run: pnpm test:peer-latest

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Use Node.js 22.x
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies
        run: pnpm security:audit

  guarddog:
    name: GuardDog · sources & npm tarball
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout scanned commit
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.14.0

      - name: Download release candidate from this run
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-artifact

      - name: Setup Python
        # actions/setup-python@v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.11

      - name: Install pinned GuardDog and dependencies
        run: |
          python -m pip install --no-deps -r .github/guarddog-requirements.txt
          python -m pip check
          mkdir -p security-reports
          python -m pip freeze > security-reports/scanner-environment.txt

      - name: Verify real scanner exit codes and blocking policy
        env:
          GUARDDOG_BIN: guarddog
        run: node --test scripts/security/guarddog-cli.test.mjs

      - name: Scan own sources and packed contents; enforce policy
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security/run-guarddog.mjs

      - name: Preserve GuardDog evidence even on detections or errors
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to NPM
    needs:
      - build-and-test
      - peer-minimum-contract
      - peer-latest-contract
      - dependency-audit
      - guarddog
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        # actions/checkout@v6
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # SIN `registry-url`: esa opcion hace que setup-node escriba un .npmrc con
      # `_authToken=${NODE_AUTH_TOKEN}` y exporte un NODE_AUTH_TOKEN placeholder
      # (XXXXX-XXXXX-...). npm lo toma como credencial y NUNCA intenta OIDC -> 404.
      # Sin authToken + id-token: write + npm >= 11.5.1, npm usa el Trusted Publisher.
      - name: Setup Node.js for Publishing
        # actions/setup-node@v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x

      - name: Download scanned release candidate
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-artifact

      - name: Download successful scan evidence
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: security-reports
          path: security-reports

      - name: Verify scanned artifact identity and hash
        id: pack
        run: node scripts/security/check-publish-artifact.mjs

      - name: Generate release provenance
        # actions/attest@v4.1.1
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: ${{ steps.pack.outputs.package_file }}

      # npm 11.18.0 via npx. El id-token de Actions
      # autentica contra el Trusted Publisher OIDC; no usamos `latest` porque npm 12.0.0
      # rompio `publish --provenance` en npx por falta de `sigstore`.
      - name: Publish to NPM (OIDC trusted publisher)
        run: |
          npx -y npm@11.18.0 --version
          npx -y npm@11.18.0 publish "${{ steps.pack.outputs.package_file }}" --access public --provenance --ignore-scripts
